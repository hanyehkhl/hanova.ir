<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanova - ورود</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Tahoma,Arial,sans-serif;
    background:#0a0a1a;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}
canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}
.login-box{
    position:relative;
    z-index:10;
    width:380px;
    padding:40px 35px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    box-shadow:0 8px 40px rgba(0,0,0,0.5);
}
.login-box h1{
    text-align:center;
    color:#fff;
    font-size:22px;
    margin-bottom:8px;
}
.login-box p.sub{
    text-align:center;
    color:rgba(255,255,255,0.45);
    font-size:13px;
    margin-bottom:30px;
}
.logo-wrap{
    text-align:center;
    margin-bottom:20px;
}
.logo-wrap .icon{
    width:64px;
    height:64px;
    background:linear-gradient(135deg,#00c896,#0080ff);
    border-radius:16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 30px rgba(0,200,150,0.3);
}
.logo-wrap .icon span{
    color:#fff;
    font-size:28px;
    font-weight:bold;
}
.field{
    margin-bottom:20px;
    position:relative;
}
.field label{
    display:block;
    color:rgba(255,255,255,0.6);
    font-size:13px;
    margin-bottom:7px;
}
.field input{
    width:100%;
    padding:13px 15px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    color:#fff;
    font-size:15px;
}
.field input:focus{
    border-color:rgba(0,200,150,0.6);
    box-shadow:0 0 12px rgba(0,200,150,0.15);
}
.toggle-pass{
    position:absolute;
    left:14px;
    top:38px;
    cursor:pointer;
    color:rgba(255,255,255,0.3);
    font-size:13px;
}
.toggle-pass:hover{
    color:rgba(255,255,255,0.6);
}
.btn{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,#00c896,#0080ff);
    border:none;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:transform 0.2s,box-shadow 0.2s;
    position:relative;
    overflow:hidden;
}
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 25px rgba(0,200,150,0.35);
}
.btn.loading{
    pointer-events:none;
    opacity:0.7;
}
.btn .spinner{
    display:none;
    width:20px;
    height:20px;
    border:3px solid rgba(255,255,255,0.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 0.6s linear infinite;
    margin:0 auto;
}
.btn.loading .btn-text{display:none}
.btn.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{
    text-align:center;
    color:#ff4757;
    font-size:13px;
    margin-top:15px;
    min-height:20px;
}
.success-msg{
    text-align:center;
    color:#00c896;
    font-size:13px;
    margin-top:15px;
}
.footer-note{
    text-align:center;
    color:rgba(255,255,255,0.2);
    font-size:11px;
    margin-top:25px;
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="login-box">
    <div class="logo-wrap">
        <div class="icon"><span>R</span></div>
    </div>

    <h1>hanova</h1>
    <p class="sub">برای ورود به محیط کاری، نام کاربری و رمز عبور خود را وارد کنید</p>

    <form id="loginForm">
        <div class="field">
            <label for="username">نام کاربری</label>
            <input id="username" name="username" required placeholder="نام کاربری">
        </div>
        <div class="field">
            <label for="password">رمز عبور</label>
            <input type="password" id="password" name="password" required placeholder="رمز عبور">
            <span class="toggle-pass" id="togglePass">نمایش</span>
        </div>

        <button type="submit" class="btn" id="submitBtn">
            <span class="btn-text">ورود</span>
            <div class="spinner"></div>
        </button>

        <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="footer-note">hanova Platform</div>
</div>


<script>
(function(){
    // چک وضعیت لاگین در لود صفحه
    fetch("/api/auth/check.php", {
        credentials: 'include'
    })
    .then(r => r.json())
    .then(res => {
        if(res.logged_in){
            if(res.user && res.user.is_admin){
                location.href = "/admin";
            } else {
                location.href = "/workspace";
            }
        }
    })
    .catch(() => {
        // سشن وجود ندارد، کاربر در صفحه لاگین می‌ماند
    });

    document.getElementById('loginForm').addEventListener('submit', function(e){
        e.preventDefault();
        const btn = document.querySelector('button[type="submit"]');
        const errorMsg = document.getElementById('errorMsg');
        btn.classList.add("loading");

        const data = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
        };

        fetch("/api/auth/login.php", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: 'include',
            body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(res => {
            btn.classList.remove("loading");
            if(res.success){
                errorMsg.className = "success-msg";
                errorMsg.textContent = "ورود موفق. در حال انتقال...";
                setTimeout(() => {
                    if(res.user && res.user.is_admin){
                        location.href = "/admin";
                    } else {
                        location.href = "/workspace";
                    }
                }, 700);
            } else {
                errorMsg.textContent = res.message || "خطای ورود";
            }
        })
        .catch(() => {
            btn.classList.remove("loading");
            errorMsg.textContent = "خطا در ارتباط با سرور";
        });
    });
})();
</script>


</body>
</html>
